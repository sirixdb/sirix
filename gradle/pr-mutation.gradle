import org.gradle.api.GradleException

// Opt-in PR scope; the weekly curated core configuration stays unchanged.
def mutationModule = providers.gradleProperty('prMutationModule').get()
def mutationProject = findProject(":${mutationModule}")
if (mutationProject == null || mutationProject == rootProject) {
    throw new GradleException("Unknown PR mutation module: ${mutationModule}")
}
configure(mutationProject) {
    apply plugin: 'info.solidsoft.pitest'
    dependencies {
        // PIT's tool classpath: the lane's own interceptor (CHANGEDLINES) and result listener
        // (STREAM). CI-only tooling, never a dependency of the module under analysis.
        pitest project(':sirix-pit-changed-lines')
    }
    // Configure after module scripts, so core's curated scope cannot overwrite the PR selection.
    afterEvaluate {
        def targets = rootProject.file(providers.gradleProperty('prMutationTargetsFile').get()).readLines()
                .findAll { !it.isBlank() }
        if (targets.isEmpty() || targets.any { it.contains('*') || it.contains('?') }) {
            throw new GradleException('PR mutation targets must be nonempty, exact class names')
        }
        def mutantLimit = providers.gradleProperty('prMutationMaxMutations').getOrNull()
        if (mutantLimit != null && !(mutantLimit ==~ /[1-9][0-9]*/)) {
            throw new GradleException("PR mutation mutant limit must be a positive integer: ${mutantLimit}")
        }
        // CONV-205: the lane mutates the PR's own lines only. The reporter writes the changed-line
        // map and reads the census the interceptor writes beside it. A focused rerun omits
        // the map to mutate every line of the same targets.
        def featureArgument = { String name, String value ->
            if (value.isBlank() || value =~ /[\[\](),\s]/) {
                throw new GradleException("PR mutation ${name} path must be non-blank and free of " +
                        "brackets, commas, parentheses and whitespace: ${value}")
            }
            "${name}[${value}]"
        }
        def changedLinesFile = providers.gradleProperty('prMutationChangedLinesFile').getOrNull()
        def pitFeatures = []
        if (changedLinesFile != null) {
            // One parameter only: PIT 1.25.5's feature parser reads a feature's first parameter
            // and silently ignores the rest, so the interceptor derives the census path from
            // this one (census.jsonl beside the map).
            pitFeatures.add("+CHANGEDLINES(${featureArgument('file', changedLinesFile)})".toString())
        }
        def standardTest = tasks.named('test').get()
        // Preserve each module's opens/exports and test properties, without its workstation-sized
        // heap, GC tuning or coverage agent. PIT forks two bounded minions on the CI runner.
        def minionArgs = providers.provider {
            def inherited = standardTest.jvmArgs.findAll {
                !it.startsWith('-X') && !it.startsWith('-javaagent:')
            }
            standardTest.systemProperties.each { key, value ->
                if (value != null) {
                    inherited.add("-D${key}=${value}".toString())
                }
            }
            // Evaluate after configuration, including the query native-image test properties.
            // Protect both transports: PIT's comma-separated CLI and its Java launcher argfile.
            inherited.collect { argument ->
                def quoted = '"' + argument.replace('\\', '\\\\').replace('"', '\\"') + '"'
                argument.contains(',') ? '{' + quoted + '}' : quoted
            }
        }
        pitest {
            pitestVersion = '1.25.5'
            junit5PluginVersion = '1.2.3'
            targetClasses = targets
            targetTests = providers.gradleProperty('prMutationTests').get().split(',').toList()
            // This lane starts no Keycloak service; use REST's existing offline test contract.
            if (mutationModule == 'sirix-rest-api') {
                includedGroups = ['offline']
            }
            // No per-class sample in the lane (CONV-205): once the scope is the changed lines
            // there is nothing left worth sampling, and a sampled changed-line count could not be
            // read as a complete measurement. The limit stays available for a manual focused
            // rerun of every line of its targets. It is PIT's CLASSLIMIT interceptor feature
            // (org.pitest.mutationtest.filter.LimitNumberOfMutationsPerClassFilterFactory), whose
            // createEvenlyDistributedSampling strides across the class rather than taking the
            // first N, without guaranteeing every method is reached — and a FILTER, so the
            // changed-line restriction above always runs before it.
            if (mutantLimit != null) {
                pitFeatures.add("+CLASSLIMIT(limit[${mutantLimit}])".toString())
            }
            if (!pitFeatures.isEmpty()) {
                features = pitFeatures
            }
            // Fresh random exploration belongs in the ordinary test lanes, not PIT's baseline.
            // Isolated startup/allocation suites need their dedicated JVMs, just as for test.
            excludedTestClasses = ['io.sirix.property.*', '*JsonModelBasedOracleRandomTest',
                                   '*HOTStructuralPropertyTest*', '*SoakTest*'] +
                    standardTest.excludes.collect { it.replace('/', '.').replace('.class', '') }
            threads = 2
            timestampedReports = false
            // The controlling-JVM agent drains units in completion order: PIT 1.25.5
            // otherwise waits for earlier units before delivering STREAM callbacks.
            outputFormats = ['HTML', 'XML', 'STREAM']
            reportDir = rootProject.file(providers.gradleProperty('prMutationReportDir').get())
            // The reporter decides what an empty report means: with the scope restricted to
            // changed lines, "no mutants" can mean the restriction removed every one, which its
            // census proves and which is a measurement rather than a broken run (CONV-205).
            // A missing or empty report the census cannot explain is still incomplete.
            failWhenNoMutations = false
            mutationThreshold = 0
            coverageThreshold = 0
            timeoutConstInMillis = 10000
            jvmArgs = minionArgs.map { inherited ->
                inherited + ['--enable-preview', '--add-modules=jdk.incubator.vector',
                             // Match the smallest query CI heap: the large generic grouping
                             // oracle exhausts 1536 MiB during coverage discovery.
                             '-Xmx3g', '-XX:MaxDirectMemorySize=1g', '-Dsirix.stress.run.millis=200']
            }
            mainProcessJvmArgs = rootProject.project(':sirix-pit-changed-lines').tasks.named('jar')
                    .flatMap { it.archiveFile }.map { agent ->
                        ['--enable-preview', '-Xmx1536m', "-javaagent:${agent.asFile.absolutePath}".toString()]
                    }
        }
    }
}

plugins {
    id 'me.champeau.jmh' version '0.7.3'
}

dependencies {
    // JMH dependencies
    jmhImplementation project(':sirix-core')
    jmhImplementation project(':sirix-query')
    jmhImplementation implLibraries.brackit
    jmhImplementation implLibraries.logbackClassic
    // sirix-core keeps this as an implementation dependency, so it is not on the benchmark
    // classpath transitively. StringRegionDictionaryBenchmark needs it directly to time the
    // dictionary's hash against the FNV-1a it replaced.
    jmhImplementation implLibraries.zeroAllocationHashing
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

description = 'JMH benchmarks for SirixDB performance testing'

// The root build wires --enable-preview and the vector incubator module into compileJava /
// compileTestJava only; the jmh source set has its own compile task, and the Vector-API
// benchmarks (ProjectionFoldKernelBenchmark) need both flags there too.
tasks.named('compileJmhJava') {
    options.compilerArgs += ['--enable-preview', '--add-modules=jdk.incubator.vector']
}
// The bytecode generator reflects over the compiled benchmark classes in its own forked
// JVM, so it needs the same flags to load them.
tasks.named('jmhRunBytecodeGenerator') {
    jvmArgs.addAll(['--enable-preview', '--add-modules=jdk.incubator.vector'])
}
// ...and the generated subclasses of those benchmarks are compiled by a THIRD task, which the
// plugin configures with only source/classpath/destination.
tasks.named('jmhCompileGeneratedClasses') {
    options.compilerArgs += ['--enable-preview', '--add-modules=jdk.incubator.vector']
}

def jmhIncludesProperty = (findProperty('jmh.includes') ?: '').toString().trim()
def jmhProfilersProperty = (findProperty('jmh.profilers') ?: '').toString().trim()
def jmhBenchmarkParametersProperty = (findProperty('jmh.benchmarkParameters') ?: '').toString().trim()

def parseBenchmarkParameters = { String raw ->
    def params = [:]
    raw.split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .each { entry ->
            def separatorIndex = entry.indexOf('=')
            if (separatorIndex <= 0 || separatorIndex == entry.length() - 1) {
                throw new GradleException("Invalid jmh.benchmarkParameters entry '${entry}'. Expected key=value.")
            }

            def key = entry.substring(0, separatorIndex).trim()
            def value = entry.substring(separatorIndex + 1).trim()

            if (value.contains('|')) {
                params[key] = value
                    .split('\\|')
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }
            } else {
                params[key] = [value]
            }
        }
    return params
}

// The defaults below are tuned for the heavy end-to-end benchmarks, where a single iteration
// already takes a long time. They are far too thin for the microbenchmarks (page codecs, varint
// decode, dictionary hashing), which finish in milliseconds and need more iterations and a second
// fork before their confidence intervals mean anything. Override per run, e.g.
//   ./gradlew :sirix-benchmarks:jmh -Pjmh.includes="PageCodecEncodeBenchmark" \
//       -Pjmh.warmupIterations=5 -Pjmh.iterations=10 -Pjmh.fork=2
// `minimum` differs per setting rather than being a blanket non-negative check: zero warmup
// iterations is a legitimate ask, whereas zero measurement iterations or zero forks are rejected
// by JMH itself, and failing here names the property instead of surfacing deep inside the runner.
// (`raw.empty` / `raw.integer` are the property forms of isEmpty()/isInteger().)
Closure<Integer> jmhIntProperty = { String name, int fallback, int minimum ->
    String raw = (findProperty(name) ?: '').toString().trim()
    if (raw.empty) {
        return fallback
    }
    int parsed = raw.integer ? raw.toInteger() : Integer.MIN_VALUE
    if (parsed < minimum) {
        throw new GradleException("Invalid ${name} '${raw}'. Expected an integer >= ${minimum}.")
    }
    parsed
}

jmh {
    warmupIterations = jmhIntProperty('jmh.warmupIterations', 2, 0)
    iterations = jmhIntProperty('jmh.iterations', 3, 1)
    fork = jmhIntProperty('jmh.fork', 1, 1)

    // Extra JVM arguments for the forked benchmark JVMs, e.g.
    //   -Pjmh.jvmArgs="-Dsirix.bench.store=/path/to/store -Dsirix.bench.db=db-name"
    // A benchmark that reads a prebuilt store needs to be told where it is, and @Fork's
    // jvmArgsAppend can only carry compile-time constants.
    def jmhExtraJvmArgs = (findProperty('jmh.jvmArgs') ?: '').toString().trim()

    jvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview'
    ] + (jmhExtraJvmArgs.isEmpty() ? [] : jmhExtraJvmArgs.split('\\s+').toList())
    
    resultFormat = 'TEXT'
    
    // Use ASM generator instead of reflection
    // duplicateClassesStrategy = DuplicatesStrategy.WARN

    if (!jmhIncludesProperty.isEmpty()) {
        includes = jmhIncludesProperty
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    }

    // Attach JMH profilers to the forked JVMs, e.g.
    //   -Pjmh.profilers="gc"                      allocation rate and churn per operation
    //   -Pjmh.profilers="stack:lines=5"           JMH's own sampling profiler
    //   -Pjmh.profilers="gc,stack"                several at once, comma-separated
    // A profiler argument list uses ';' internally (JMH's own separator), so only ',' splits
    // entries here. Knowing *where* a benchmark spends its time is most of the value of having
    // one, and without this the plugin gives no way to ask.
    if (!jmhProfilersProperty.isEmpty()) {
        profilers = jmhProfilersProperty
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    }

    if (!jmhBenchmarkParametersProperty.isEmpty()) {
        def parsedParameters = parseBenchmarkParameters(jmhBenchmarkParametersProperty)
        def typedParameters = parsedParameters.collectEntries { key, values ->
            def listProperty = project.objects.listProperty(String)
            listProperty.set(values)
            [(key): listProperty]
        }
        benchmarkParameters = typedParameters
    }
}

// Convenience task: export the synthesised scale-bench dataset to CSV so the
// same workload can be loaded into DuckDB / CedarDB / Umbra for a baseline
// columnar-engine comparison. Uses Random(42), 18+rng.nextInt(48) ages, and
// the same DEPTS/CITIES arrays as GeneratedRecordsReader so aggregates
// match bit-for-bit across engines.
// Usage:
//   ./gradlew :sirix-benchmarks:exportScaleCsv -PcsvArgs="10000000 /tmp/records-10m.csv"
tasks.register('exportScaleCsv', JavaExec) {
    group = 'benchmark'
    description = 'Export scale-bench dataset as CSV for cross-engine comparison.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.sirix.benchmark.ExportScaleBenchCsv'
    def argsStr = (findProperty('csvArgs') ?: '1000000 /tmp/records-1m.csv').toString()
    args = argsStr.split(/\s+/).findAll { !it.isEmpty() }
    jvmArgs = [
        '--enable-preview',
        '-Xms512m',
        '-Xmx2g'
    ]
}

// Convenience task: run the pure-Brackit in-memory baseline (no Sirix storage)
// over the same synthetic dataset / query set as runScale, for an
// apples-to-apples engine comparison.
// Usage:
//   ./gradlew :sirix-benchmarks:runBrackitScale -Pscale.args="1000000 5"
tasks.register('runBrackitScale', JavaExec) {
    group = 'benchmark'
    description = 'Run BrackitInMemoryScaleBenchMain (pure Brackit baseline, no Sirix).'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.sirix.benchmark.BrackitInMemoryScaleBenchMain'
    def argsStr = (findProperty('scale.args') ?: '1000000 5').toString()
    args = argsStr.split(/\s+/).findAll { !it.isEmpty() }
    def baseJvmArgs = [
        '--enable-preview',
        '-Xms1g',
        '-Xmx12g'
    ]
    def extraJvmArgs = (findProperty('scale.jvmArgs') ?: '').toString().trim()
    if (!extraJvmArgs.isEmpty()) {
        jvmArgs = baseJvmArgs + extraJvmArgs.split(/\s+/).findAll { !it.isEmpty() }
    } else {
        jvmArgs = baseJvmArgs
    }
}

// Convenience task: run BrackitQueryOnSirixScaleMain directly (not via JMH).
// Usage:
//   ./gradlew :sirix-benchmarks:runScale -Pscale.args="1000000 true 3"
//   ./gradlew :sirix-benchmarks:runScale -Pscale.args="10000000 true 3" \
//      -Pscale.jvmArgs="-agentpath:/path/libasyncProfiler.so=start,event=cpu,file=/tmp/p.collapsed"
tasks.register('runScale', JavaExec) {
    group = 'benchmark'
    description = 'Run BrackitQueryOnSirixScaleMain for large-dataset perf iteration.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.sirix.benchmark.BrackitQueryOnSirixScaleMain'
    def argsStr = (findProperty('scale.args') ?: '1000000 true 3').toString()
    args = argsStr.split(/\s+/).findAll { !it.isEmpty() }
    def baseJvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview',
        '-Xms8g',
        '-Xmx24g'
    ]
    def extraJvmArgs = (findProperty('scale.jvmArgs') ?: '').toString().trim()
    if (!extraJvmArgs.isEmpty()) {
        jvmArgs = baseJvmArgs + extraJvmArgs.split(/\s+/).findAll { !it.isEmpty() }
    } else {
        jvmArgs = baseJvmArgs
    }
}

// The SirixDB half of docs/COMPARISON_POSTGRES.md (W1-W6). In-tree so §6's reproduction is a
// command rather than a prose spec — the original driver lived in /tmp and did not survive.
//   ./gradlew :sirix-benchmarks:postgresComparison -Ppgcmp.args='5000 1000 lean'
tasks.register('postgresComparison', JavaExec) {
    group = 'benchmark'
    description = 'Versioned-document workloads W1-W6 against which PostgreSQL is compared'
    dependsOn 'jmhClasses'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.sirix.benchmark.PostgresComparisonBench'
    def argsStr = (findProperty('pgcmp.args') ?: '5000 1000 lean').toString()
    args = argsStr.split(/\s+/).findAll { !it.isEmpty() }
    def extraJvm = (findProperty('pgcmp.jvmArgs') ?: '').toString().trim()
    jvmArgs = (extraJvm.isEmpty() ? [] : extraJvm.split(/\s+/).findAll { !it.isEmpty() }) + [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview',
        '-Xms1g',
        '-Xmx4g'
    ]
}

// The SirixDB half of docs/COMPARISON_POSTGRES_BULK.md. Same reasoning as postgresComparison
// above: the reproduction has to be a command, not a prose spec.
//   ./gradlew :sirix-benchmarks:postgresBulk -Ppgbulk.args='query /path/store db-2gb 12'
tasks.register('postgresBulk', JavaExec) {
    group = 'benchmark'
    description = 'Bulk JSON corpus comparison against PostgreSQL (ndjson | ingest | query | projquery)'
    dependsOn 'jmhClasses'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.sirix.benchmark.PostgresBulkBench'
    def argsStr = (findProperty('pgbulk.args') ?: '').toString()
    args = argsStr.split(/\s+/).findAll { !it.isEmpty() }
    def extraJvm = (findProperty('pgbulk.jvmArgs') ?: '').toString().trim()
    jvmArgs = (extraJvm.isEmpty() ? [] : extraJvm.split(/\s+/).findAll { !it.isEmpty() }) + [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview',
        '-Xmx8g'
    ]
}

// Prints the classpath the bulk benchmark needs, so a driver script can launch a BARE JVM per
// measurement. That matters for the cold regime: going through JavaExec would fold Gradle's own
// startup and daemon state into a number whose whole point is that nothing is warm.
//   CP=$(./gradlew -q :sirix-benchmarks:bulkBenchClasspath | tail -1)
tasks.register('bulkBenchClasspath') {
    group = 'benchmark'
    description = 'Print the runtime classpath for PostgresBulkBench (for bare-JVM cold runs)'
    dependsOn 'jmhClasses'
    def cp = sourceSets.jmh.runtimeClasspath
    doLast {
        println cp.asPath
    }
}

// Optional io_uring/direct-IO storage provider from sirix-enterprise, for the one-shot
// PAX-vs-projection benchmarks' storage=IO_URING arm. Point -PenterpriseCoreJar at a
// sirix-enterprise-core jar built against THIS tree's sirix-core (publishToMavenLocal
// first). jctools is that provider's one dependency sirix-core does not already carry.
if (project.hasProperty('enterpriseCoreJar')) {
    dependencies {
        jmhImplementation files(project.property('enterpriseCoreJar'))
        jmhImplementation 'org.jctools:jctools-core:4.0.6'
    }
}

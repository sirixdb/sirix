// ClickBench runner: runs the 43 queries under the ClickBench protocol. Usage:
//   ./gradlew :sirix-query:clickBench -Pclickbench.args="/tmp/cb-1m --tries 3 --json /tmp/cb.json"
//   ./gradlew :sirix-query:clickBench -Pclickbench.args="/tmp/cb-1m --tries 1 --dump /tmp/cb-results"
tasks.register('clickBench', JavaExec) {
    group = 'verification'
    description = 'Run the 43 ClickBench queries against a loaded SirixDB resource.'
    classpath = sourceSets.main.runtimeClasspath
    // Enterprise backend A/B: -Penterprise.jars=jar1:jar2 appends provider jars (e.g. the
    // io_uring StorageProvider) — SPI discovery does the rest.
    if (project.hasProperty('enterprise.jars')) {
        classpath += files(project.property('enterprise.jars').toString().split(':'))
    }
    mainClass = 'io.sirix.query.bench.clickbench.ClickBenchRunMain'
    def argsStr = (findProperty('clickbench.args') ?: '').toString()
    args = argsStr.isEmpty() ? [] : argsStr.split(/\s+/).findAll { !it.isEmpty() }
    // C2, not the Graal JIT, for the query JVM: on GraalVM the JVMCI compiler takes seconds to compile
    // the mega-kernels, so the "hot" tries of a short query run C1 code (100M q39: 0.49 s under Graal,
    // 0.065 s under C2 — the whole q36–q42 family swung 3–6× between legs for this reason alone). The
    // Unlock flag makes the switch a no-op on a plain HotSpot build, where the flag is experimental.
    def baseJvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview',
        '-XX:+UnlockExperimentalVMOptions',
        '-XX:-UseJVMCICompiler',
        '-Xms4g',
        '-Xmx12g',
        // Column residency budget: the default is min(cacheBytes/2, heap/4) = 3 GB on this heap, and
        // the 100M string columns a grouped query keeps (Title/URL/SearchPhrase/UserID ≈ 4.6 GB) were
        // refused every try, so the hot tries re-decoded them from the segment bytes. 5 GB keeps them
        // resident: c6a hot rank 16 → 14 (q10 0.22 → 0.07 s, q8 0.87 → 0.60), 43/43 answers identical.
        '-Dsirix.projection.eagerMaterializeBytes=5368709120'
    ]
    def extraJvmArgs = (findProperty('clickbench.jvmArgs') ?: '').toString().trim()
    jvmArgs = extraJvmArgs.isEmpty()
        ? baseJvmArgs
        : baseJvmArgs + extraJvmArgs.split(/\s+/).findAll { !it.isEmpty() }
}


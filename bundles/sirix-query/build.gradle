def hftBuildIdentityRelativePath = 'META-INF/sirix-hft-build.properties'
// Own output directory rather than compileJava's: every project that depends on :sirix-query reads
// that class directory as an input, so a second task writing into it is an undeclared producer and
// Gradle fails the consumer's validation. Registering the directory on the main source set keeps the
// attestation on the runtime classpath (and inside the jar) while giving consumers the task
// dependency automatically.
def hftBuildIdentityDir = layout.buildDirectory.dir('hft-identity/main')
def hftBuildIdentityFile = hftBuildIdentityDir.map { it.file(hftBuildIdentityRelativePath) }
def hftTestBuildIdentityFile = tasks.named('compileTestJava', JavaCompile).flatMap {
    it.destinationDirectory.file(hftBuildIdentityRelativePath)
}

def hftGitOutput = { List<String> arguments ->
    def process = new ProcessBuilder(['git'] + arguments)
        .directory(rootDir)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText('UTF-8').trim()
    if (process.waitFor() != 0) {
        throw new GradleException("git ${arguments.join(' ')} failed: ${output}")
    }
    output
}
def hftUpdateFile = { java.security.MessageDigest digest, File file ->
    file.withInputStream { source ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = source.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
}
def hftUpdateLong = { java.security.MessageDigest digest, long value ->
    for (int shift = 56; shift >= 0; shift -= 8) {
        digest.update((byte) (value >>> shift))
    }
}
def hftEntryDigest = { File entry ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    if (entry.isFile()) {
        digest.update((byte) 70)
        digest.update((byte) 0)
        hftUpdateFile(digest, entry)
        return digest.digest()
    }
    if (!entry.isDirectory()) {
        throw new GradleException("runtime classpath entry is unreadable: ${entry}")
    }
    digest.update((byte) 68)
    digest.update((byte) 0)
    def rootPath = entry.toPath()
    def files
    java.nio.file.Files.walk(rootPath).withCloseable { stream ->
        files = stream.filter { java.nio.file.Files.isRegularFile(it) }
            .filter { rootPath.relativize(it).toString().replace(File.separatorChar, '/' as char)
                != hftBuildIdentityRelativePath }
            .sorted(java.util.Comparator.comparing {
                rootPath.relativize(it).toString().replace(File.separatorChar, '/' as char)
            })
            .toList()
    }
    for (def file : files) {
        byte[] name = rootPath.relativize(file).toString().replace(File.separatorChar, '/' as char)
            .getBytes('UTF-8')
        hftUpdateLong(digest, name.length)
        digest.update(name)
        hftUpdateLong(digest, java.nio.file.Files.size(file))
        hftUpdateFile(digest, file.toFile())
    }
    digest.digest()
}
def hftRuntimeClasspathSha256 = { String classpath ->
    def aggregate = java.security.MessageDigest.getInstance('SHA-256')
    aggregate.update('SIRIX-HFT-CLASSPATH-V1\0'.getBytes('UTF-8'))
    classpath.split(java.util.regex.Pattern.quote(File.pathSeparator), -1).each { rawEntry ->
        if (rawEntry.isBlank()) {
            throw new GradleException('runtime classpath contains an empty entry')
        }
        aggregate.update(hftEntryDigest(new File(rawEntry).canonicalFile))
    }
    java.util.HexFormat.of().formatHex(aggregate.digest())
}
def hftEnsureOutputDirectories = { sourceSet ->
    sourceSet.output.files.each { output ->
        if (!output.isDirectory() && !output.mkdirs()) {
            throw new GradleException("cannot materialize runtime output directory: ${output}")
        }
    }
}
def hftWriteBuildIdentity = { outputProvider, String runtimeClasspath ->
    def outputFile = outputProvider.get().asFile
    if (!outputFile.parentFile.isDirectory() && !outputFile.parentFile.mkdirs()) {
        throw new GradleException("cannot materialize HFT identity directory: ${outputFile.parentFile}")
    }
    def gitSha = hftGitOutput(['rev-parse', 'HEAD'])
    def clean = hftGitOutput(['status', '--porcelain', '--untracked-files=normal']).isEmpty()
    def artifactSha256 = hftRuntimeClasspathSha256(runtimeClasspath)
    outputFile.setText("gitSha=${gitSha}\nclean=${clean}\nartifactSha256=${artifactSha256}\n", 'UTF-8')
}

tasks.register('generateHftBuildIdentity') {
    dependsOn(tasks.named('compileJava'), tasks.named('compileKotlin'), tasks.named('processResources'))
    // Hashing the runtime classpath reads every entry on it, so every entry has to exist first.
    // Compile avoidance means compileJava consumes a project dependency's classes DIRECTORY, never
    // its jar, so the compile tasks above do not build :sirix-core:jar -- yet the runtime classpath
    // resolves exactly that jar. Depend on the resolvable configuration rather than on
    // sourceSets.main.runtimeClasspath: the source set's classpath now carries this task's own
    // output directory, and depending on that would be a cycle.
    dependsOn(configurations.runtimeClasspath)
    outputs.dir(hftBuildIdentityDir)
    outputs.upToDateWhen { false }
    doLast {
        hftEnsureOutputDirectories(sourceSets.main)
        hftWriteBuildIdentity(hftBuildIdentityFile, sourceSets.main.runtimeClasspath.asPath)
    }
}

sourceSets.main.output.dir(hftBuildIdentityDir, builtBy: 'generateHftBuildIdentity')

tasks.register('generateHftTestBuildIdentity') {
    dependsOn(tasks.named('testClasses'))
    // Same reason as generateHftBuildIdentity: the test runtime classpath carries jars no compile
    // task is obliged to produce.
    dependsOn(configurations.testRuntimeClasspath)
    outputs.file(hftTestBuildIdentityFile)
    outputs.upToDateWhen { false }
    doLast {
        hftEnsureOutputDirectories(sourceSets.main)
        hftEnsureOutputDirectories(sourceSets.test)
        hftWriteBuildIdentity(hftTestBuildIdentityFile, sourceSets.test.runtimeClasspath.asPath)
    }
}

tasks.named('classes').configure {
    dependsOn(tasks.named('generateHftBuildIdentity'))
}


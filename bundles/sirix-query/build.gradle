test {
    useJUnitPlatform()
    systemProperty "io.brackit.query.debug", System.getProperty("io.brackit.query.debug")
    systemProperty "io.brackit.query.debugDir", System.getProperty("io.brackit.query.debugDir")
    systemProperty "sirix.projDiag", System.getProperty("sirix.projDiag")
    systemProperty "sirix.probe.segmentDump", System.getProperty("sirix.probe.segmentDump")
    systemProperty "sirix.probe.segmentDump.out", System.getProperty("sirix.probe.segmentDump.out")

    // Async-profiler support
    def profilerPath = System.getenv("ASYNC_PROFILER")
    def profileEvent = System.getenv("PROFILE_EVENT") ?: "cpu"
    def profileOutput = System.getenv("PROFILE_OUTPUT") ?: "/tmp/sirix-query-profile.html"
    
    // JFR profiling: set JFR_PROFILE=1 to enable
    def jfrProfile = System.getenv("JFR_PROFILE")
    def jfrOutput = System.getenv("JFR_OUTPUT") ?: "/tmp/sirix-query-flight.jfr"
    
    def baseArgs = [
        "-Duser.home=${layout.buildDirectory.get()}",
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '-XX:+UnlockDiagnosticVMOptions',
        '-XX:+DebugNonSafepoints',
    ]
    
    if (profilerPath) {
        baseArgs.add("-agentpath:${profilerPath}/lib/libasyncProfiler.so=start,event=${profileEvent},file=${profileOutput}")
        println "Async-profiler enabled: event=${profileEvent}, output=${profileOutput}"
    }
    
    if (jfrProfile) {
        baseArgs.add("-XX:StartFlightRecording=duration=300s,filename=${jfrOutput},settings=profile")
        println "JFR profiling enabled: output=${jfrOutput}"
    }
    
    jvmArgs = baseArgs
}

// Scale-bench runner: shreds a configurable record count and runs all 9
// analytical queries, printing ms and result sizes. Usage (via Gradle):
//   ./gradlew :sirix-query:scaleBench -Pscale.args="10000000 false 1" \
//       -Pscale.jvmArgs="-Dsirix.compression=none -Dprojection=true"
tasks.register('scaleBench', JavaExec) {
    group = 'verification'
    description = 'Run ScaleBenchMain (shred + 9 analytical queries).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.sirix.query.bench.ScaleBenchMain'
    def scaleArgsStr = (findProperty('scale.args') ?: '').toString()
    args = scaleArgsStr.isEmpty() ? [] : scaleArgsStr.split(/\s+/).findAll { !it.isEmpty() }
    def baseJvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED',
        '--enable-preview',
        '-Xms4g',
        '-Xmx12g'
    ]
    def extraScaleJvmArgs = (findProperty('scale.jvmArgs') ?: '').toString().trim()
    if (!extraScaleJvmArgs.isEmpty()) {
        jvmArgs = baseJvmArgs + extraScaleJvmArgs.split(/\s+/).findAll { !it.isEmpty() }
    } else {
        jvmArgs = baseJvmArgs
    }
}


// Task to run only native-image smoke tests on JVM (for validation before native compilation)
tasks.register('nativeImageSmokeTest', Test) {
    description = 'Run native-image smoke tests on JVM'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'native-image'
    }
    jvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-modules', 'jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED'
    ]
    minHeapSize = '2g'
    maxHeapSize = '4g'
}

// FIXED UPSTREAM in the EA channel: graalvm-25.3.4.1-dev (native-image 2026-08-18) instruments
// cleanly with jline present, so this exclusion only matters for GA toolchains.
// PGO instrumentation crashes GraalVM's register allocator (25.0.3 and 25.0.4:
// "mismatched definition: r10|QWORD != r10|QWORD[.]") while compiling the FFM UPCALL stub that
// jline's terminal provider registers (an int->void signal handler) — the only upcall in the
// dependency graph. The benchmark mains never touch a terminal, so the instrumented image simply
// builds without jline; the final --pgo build keeps the full classpath (profiles are keyed by
// method, missing entries are neutral).
if (project.hasProperty('pgo-instrument') && !project.hasProperty('pgo-keep-jline')) {
    configurations.matching { it.name == 'nativeImageClasspath' }.configureEach {
        exclude group: 'org.jline'
    }
}

// GraalVM Native Image Configuration
graalvmNative {
    registerTestBinary("smokeTest") {
        usingSourceSet(sourceSets.test)
        forTestTask(tasks.named("nativeImageSmokeTest"))
    }
    binaries {
        // Smoke test binary (compiled to native image via nativeSmokeTest task)
        smokeTest {
            // Preview features and vector API
            buildArgs.add('--enable-preview')
            buildArgs.add('--enable-native-access=ALL-UNNAMED')
            buildArgs.add('--add-modules=jdk.incubator.vector')
            buildArgs.add('-H:+ForeignAPISupport')
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            // Module exports for JNA/JNR/JNI
            buildArgs.add('--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED')
            buildArgs.add('--add-exports=java.base/sun.nio.ch=ALL-UNNAMED')
            buildArgs.add('--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang.reflect=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.io=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.util=ALL-UNNAMED')
            // Logging frameworks - build time
            buildArgs.add('--initialize-at-build-time=org.slf4j')
            buildArgs.add('--initialize-at-build-time=ch.qos.logback')
            buildArgs.add('--initialize-at-build-time=org.xml.sax.helpers')
            // Jackson - build time
            buildArgs.add('--initialize-at-build-time=com.fasterxml.jackson')
            // Sirix FFI components - run time
            buildArgs.add('--initialize-at-run-time=io.sirix.cache.LinuxMemorySegmentAllocator')
            buildArgs.add('--initialize-at-run-time=io.sirix.cache.WindowsMemorySegmentAllocator')
            buildArgs.add('--initialize-at-run-time=io.sirix.io.bytepipe.FFILz4Compressor')
            // JLine terminal providers - run time
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl')
            // Use G1 GC
            buildArgs.add('--gc=G1')
            // Quick build for faster test compilation
            quickBuild = true
            // Allocate memory to the native-image compiler
            jvmArgs.add('-XX:MaxRAMPercentage=80')
        }
        main {
            // imageName/mainClass are overridable so the same fully-tuned binary
            // recipe can build either the scale bench (default) or the native
            // write-path smoke:
            //   ./gradlew :sirix-query:nativeCompile \
            //       -Pnative.mainClass=io.sirix.query.bench.NativeWriteSmokeMain \
            //       -Pnative.imageName=sirix-write-smoke
            imageName = (project.findProperty('native.imageName') ?: 'sirix-bench').toString()
            mainClass = (project.findProperty('native.mainClass') ?: 'io.sirix.query.bench.ScaleBenchMain').toString()
            sharedLibrary = false
            // Preview features and vector API
            buildArgs.add('--enable-preview')
            buildArgs.add('--enable-native-access=ALL-UNNAMED')
            buildArgs.add('--add-modules=jdk.incubator.vector')
            buildArgs.add('-H:+ForeignAPISupport')
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-H:+VectorAPISupport')
            // MMStorage no longer closes an Arena.ofShared() in native images:
            // io.sirix.io.SharedArenas routes shared-access arenas to
            // Arena.ofAuto() (GC-reclaimed, close is a no-op) when running as a
            // native image, so -H:+SharedArenaSupport is not needed and we keep
            // -H:+VectorAPISupport for the SIMD kernels. (Forcing the old path
            // with -Dsirix.arena.strategy=shared still trips
            // SubstrateOptimizeSharedArenaAccessPhase at *build* time and
            // closeScope0Unsupported at *run* time — see docs/NATIVE_IMAGE.md.)
            buildArgs.add('--no-fallback')
            // Module exports for JNA/JNR/JNI
            buildArgs.add('--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED')
            buildArgs.add('--add-exports=java.base/sun.nio.ch=ALL-UNNAMED')
            buildArgs.add('--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang.reflect=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.io=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.util=ALL-UNNAMED')
            // Resource includes
            buildArgs.add('-H:IncludeResources=.*\\.properties$')
            buildArgs.add('-H:IncludeResources=.*\\.xml$')
            buildArgs.add('-H:IncludeResources=.*\\.json$')
            buildArgs.add('-H:IncludeResources=org/jline/.*')
            buildArgs.add('-H:IncludeResources=jni/.*')
            buildArgs.add('-H:IncludeResources=com/sun/jna/.*')
            buildArgs.add('-H:IncludeResources=net/jpountz/.*')
            // Logging frameworks - build time
            buildArgs.add('--initialize-at-build-time=org.slf4j')
            buildArgs.add('--initialize-at-build-time=ch.qos.logback')
            buildArgs.add('--initialize-at-build-time=org.xml.sax.helpers')
            // Jackson - build time (used for JSON serialization in sirix-core)
            buildArgs.add('--initialize-at-build-time=com.fasterxml.jackson')
            // Exclude problematic library-support.jar substitutions
            buildArgs.add('--exclude-config')
            buildArgs.add('library-support.jar')
            buildArgs.add('META-INF/native-image/.*')
            // Sirix FFI components - run time
            buildArgs.add('--initialize-at-run-time=io.sirix.cache.LinuxMemorySegmentAllocator')
            buildArgs.add('--initialize-at-run-time=io.sirix.cache.WindowsMemorySegmentAllocator')
            buildArgs.add('--initialize-at-run-time=io.sirix.io.bytepipe.FFILz4Compressor')
            // JLine terminal providers - run time (they detect terminal at runtime)
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl')
            // Use G1 GC for better latency and throughput at runtime
            buildArgs.add('--gc=G1')
            // Set max heap for the native image runtime. 24g matches the
            // JVM -Xmx used for the ScaleBenchMain 100M workload — the
            // brackit-scale-bench exercises ~18 GB RSS (page cache +
            // projection index + first-query warmup), so a 4 GB cap
            // triggers OOM. 24 GB leaves the host with ~7 GB for the
            // kernel page cache + other processes on a 31 GB machine.
            buildArgs.add('-R:MaxHeapSize=24g')
            // Optimization level 3 + native-CPU codegen so AVX-512 / AVX2 intrinsics fire
            buildArgs.add('-O3')
            buildArgs.add('-march=native')

            // Profile-Guided Optimization (PGO) support
            // Step 1: Build instrumented binary: ./gradlew :sirix-query:nativeCompile -Ppgo-instrument
            // Step 2: Run workload to collect profile: ./sirix-shell < workload.xq (generates default.iprof)
            // Step 3: Build optimized binary: ./gradlew :sirix-query:nativeCompile -Ppgo=default.iprof
            if (project.hasProperty('pgo-instrument')) {
                buildArgs.add('--pgo-instrument')
                // Graal 25.0.3 crashes with "mismatched definition: r10|QWORD != r10|QWORD[.]"
                // (a register-allocator assertion) when instrumenting under -march=native.
                // The PROFILE does not need native codegen — only the final --pgo build does,
                // and iprof profiles are march-agnostic. Last -march wins.
                buildArgs.add('-march=compatibility')
            }
            if (project.hasProperty('pgo')) {
                buildArgs.add("--pgo=${project.findProperty('pgo')}")
            }

            // Enable verbose output for debugging
            verbose = true
            // quickBuild bypasses the full -O3 graph optimization stack and
            // builds in ~1-2 min vs ~15 min for a full build. Opt out via
            // -Pquick-build=false when you want the final PGO-tuned image.
            quickBuild = !"false".equalsIgnoreCase((String) project.findProperty('quick-build'))
            // Allocate memory to the native-image compiler. Default 65% so a
            // fresh Gradle daemon + a live Sirix JVM can coexist on a 31 GB host;
            // pass -Pnative.builderXmx=10g to put a hard cap on the builder heap
            // when other agents/suites are sharing the box.
            def builderXmx = project.findProperty('native.builderXmx')
            if (builderXmx) {
                jvmArgs.add("-Xmx${builderXmx}")
            } else {
                jvmArgs.add('-XX:MaxRAMPercentage=65')
            }
        }
    }
    toolchainDetection = false
}

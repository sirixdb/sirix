services:
  keycloak:
    build: .
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_LOG_LEVEL=DEBUG
      - KC_IMPORT=/opt/keycloak/data/import/realm-export.json
    # NOT 'always': a Keycloak that fails to start would otherwise reloop through realm import
    # until H2 reported "Connection is closed", masking the real cause.
    restart: "no"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    entrypoint: ["/opt/keycloak/scripts/wait-for-keycloak.sh"]
    command: >
      start-dev
      --import-realm
      --http-relative-path=/
      --hostname-strict=false
      --proxy=edge
    networks:
      - auth-network
    # bash /dev/tcp, not curl: the image has no curl (see wait-for-keycloak.sh), so the previous
    # curl healthcheck could never pass -- the container sat in "health: starting" until composeUp
    # timed out. The marker file is what makes "healthy" mean "usable": Keycloak answering
    # /realms/master only proves it is up, while the test users are seeded afterwards, so probing
    # liveness alone releases composeUp mid-seed and the suite fails on "invalid_grant".
    healthcheck:
      test: [ "CMD", "bash", "-c", "test -f /tmp/keycloak-seeded && exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r line <&3 && [[ \"$$line\" == *' 200 '* ]]" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 120s
networks:
  auth-network:
    driver: bridge

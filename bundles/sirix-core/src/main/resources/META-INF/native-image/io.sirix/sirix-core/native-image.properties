# Pure layout/VarHandle constants only; never initialize resource or allocator state here.
# Portable default: the GraalVM 25.0.x LTS line rejects build-time FFM downcall handles with linkToNative.
# A GraalVM 25 innovation release 25.1.3 or later (oracle/graal PR 13309) compiles them, so an optimized
# build may override the two pure signature adapters there; symbols remain runtime state.
Args = --initialize-at-build-time=io.sirix.node.LE,io.sirix.node.SegmentAccess

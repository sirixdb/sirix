kind = "equivalent"
checked_at = "11f89417b5c9c0f2df77d599be3fd50f6c787af7"
justification = """Kotlin's compiler-inserted null check on the platform-typed List returned by Vert.x
RoutingContext.queryParam("nodeId"). Vert.x documents and implements queryParam as returning a
non-null list (empty when the parameter is absent), so the check never fires for any request.
Were it ever null, the very next instruction (the inlined getOrNull reading the list's size)
throws the same NullPointerException, so results, errors, state and cost are identical either way."""


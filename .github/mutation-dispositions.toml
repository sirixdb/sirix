mutator = "org.pitest.mutationtest.engine.gregor.mutators.VoidMethodCallMutator"
indexes = [78]
description = "removed call to kotlin/jvm/internal/Intrinsics::checkNotNullExpressionValue"
kind = "equivalent"
checked_at = "b8cb7fe7541b52fd3226346f8a7ffdd67946223e"
justification = """TXN-615 clause 10 / BackupSummary's constructor contract: notBackedUp is
List.copyOf of the supplied list, so the final Java record accessor cannot return null for
any constructed summary. This Kotlin-generated platform-type assertion has no reachable
failure arm. Removing it changes no output, errors, allocations or resource iteration; the
quiet/verbose BackupTest cases execute both empty and nonempty summaries. No nullable input
or substitute implementation of the final record is admitted by this contract."""


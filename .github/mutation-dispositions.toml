class = "io.sirix.utils.CommitTimestamps"
method = "toEpochMicros"
descriptor = "(Ljava/time/Instant;)J"
mutator = "org.pitest.mutationtest.engine.gregor.mutators.ConditionalsBoundaryMutator"
indexes = [19]
description = "changed conditional boundary"
kind = "equivalent"
checked_at = "378e162e89d7a69f019cfb20ac25a48da86cf3e2"
justification = """VER-201 requires the floor of epoch microseconds, rejecting signed-long overflow.
Changing seconds < 0 to seconds <= 0 only changes the path at the boundary seconds=0,
with positive subsecond micros u. Both 0*1000000+u and (0+1)*1000000+(u-1000000)
return u exactly without overflow. Null handling, truncation and range errors are unchanged.
Only that boundary takes one extra constant-time compensation step under CONV-201,
with no allocation or data-dependent work added.
The hosted sampled report executed 600 tests and retained this exact boundary mutant."""


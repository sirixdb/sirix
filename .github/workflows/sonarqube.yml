name: Sonarqube
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Apply the static bug gate to every Java compile, including dependent tasks.
env:
  ORG_GRADLE_PROJECT_errorProne: 'true'


jobs:
  Build:
    name: Run Sonarqube
    # Fork PRs and Dependabot do not receive SONAR_TOKEN. Never build untrusted code
    # with secrets through pull_request_target; normal CI still tests those PRs.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Coverage includes both core CI lanes.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build and generate coverage
        # Keep the daemon bounded alongside the standard 5g/12g test fork. Serial
        # project execution avoids concurrent forks exhausting the 16 GB runner.
        run: >-
          ./gradlew build jacocoTestReport --info --stacktrace --no-parallel --max-workers=2
          -x :sirix-rest-api:test -x :sirix-rest-api:jacocoTestReport
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
      - name: Analyze and check quality gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Tests and XML coverage reports already exist; the scanner only analyzes.
        # GitHub Actions supplies PR parameters automatically for PR decoration.
        run: >-
          ./gradlew sonar --info --stacktrace --max-workers=2
          -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

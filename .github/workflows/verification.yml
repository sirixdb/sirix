# Scheduled deep verification and a standalone core/MCP static-analysis run:
#
#   * mutation-testing — PIT over a curated set of correctness-critical sirix-core classes.
#     The mutation score measures whether the tests ASSERT on behavior rather than merely
#     execute it: a surviving mutant is a code change no test noticed. Scope is configured
#     in bundles/sirix-core/build.gradle (pitest block).
#
#   * full-scope-mutation — the unchanged-line debt of the sources the branch changed in the
#     last week, with no changed-line restriction and no per-class sample. This is the report
#     the pull-request lane stopped producing (CONV-205/CONV-206); it never runs for a pull
#     request and never decides an outcome.
#
#   * error-prone — compiles core and MCP with the shared static-analysis gate.
#     Gate policy and coverage across workflows: docs/VERIFICATION.md.
#
# Trigger paths: manual workflow_dispatch, or the weekly Sunday 04:00 UTC cron. Scheduled runs
# stay off the working week, when the machine is reserved for timed benchmarks.
name: Deep verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

jobs:
  mutation-testing:
    name: PIT mutation testing (sirix-core, curated scope)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run PIT
        run: ./gradlew :sirix-core:pitest --no-daemon
      - name: Print summary
        if: always()
        run: |
          if ls bundles/sirix-core/build/reports/pitest/mutations.xml >/dev/null 2>&1; then
            killed=$(grep -c "status='KILLED'" bundles/sirix-core/build/reports/pitest/mutations.xml || true)
            survived=$(grep -c "status='SURVIVED'" bundles/sirix-core/build/reports/pitest/mutations.xml || true)
            echo "Mutants killed: $killed, survived: $survived"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: bundles/sirix-core/build/reports/pitest
          if-no-files-found: ignore

  full-scope-mutation:
    name: PIT full-scope unchanged-line report
    # CONV-206: schedule and manual dispatch only - this workflow has no pull_request trigger,
    # and the report decides no outcome. Its budget is its own; the PR lane's stays untouched.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the window base is the last commit before the report's window.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile the mutated modules
        run: ./gradlew classes testClasses --parallel
      - name: Run the full-scope analysis
        # 80 minutes of the 120-minute job, leaving the compile step and the upload their room.
        run: >-
          python3 .github/scripts/pr_mutation.py full-scope --seconds 4800 --window-days 7
          --output "$RUNNER_TEMP/full-scope-mutation"
      - name: Publish the report
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/full-scope-mutation/summary.md" ]]; then
            cat "$RUNNER_TEMP/full-scope-mutation/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full-scope analysis incomplete: selection or setup failed; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scope-mutation
          path: ${{ runner.temp }}/full-scope-mutation
          if-no-files-found: warn
          retention-days: 30

  error-prone:
    name: Error Prone + NullAway (core and MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile with Error Prone
        run: ./gradlew :sirix-core:compileJava :sirix-core:compileTestJava :sirix-mcp:compileJava :sirix-mcp:compileTestJava -PerrorProne --no-daemon

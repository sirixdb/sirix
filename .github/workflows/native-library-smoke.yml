name: Native library feasibility

on:
  pull_request:
    paths:
      - 'bundles/sirix-core/**'
      - 'bundles/sirix-query/**'
      - 'tests/native/**'
      - 'gradle/**'
      - '*.gradle'
      - '.github/workflows/native-library-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'bundles/sirix-core/**'
      - 'bundles/sirix-query/**'
      - 'tests/native/**'
      - 'gradle/**'
      - '*.gradle'
      - '.github/workflows/native-library-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          # Oracle GraalVM 25i5 GA: GRAALVM_VERSION 25.5.5.0.3, JAVA_VERSION 25.0.5.0.3.
          # The native build follows the GraalVM innovation line because Native Image on
          # the 25.0.x LTS line cannot build build-time-initialized, address-less FFM
          # downcall handles (oracle/graal#14860). See docs/NATIVE_IMAGE.md, "Toolchain".
          version: '25.5.5.0.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev strace binutils
      - name: Core/query shared images and shutdown omissions, sequentially
        env:
          # Hosted runners have less free disk than the developer laptop's floor.
          SIRIX_SMOKE_DISK_FLOOR_KIB: '10485760'
          SIRIX_SMOKE_TEST_TEARDOWN_MUTATION: '1'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-library"
          tests/native/run-smoke.sh all "$RUNNER_TEMP/native-library/normal" 2>&1 \
            | tee "$RUNNER_TEMP/native-library/normal.log"
      - name: Core constructor omissions, sequentially
        env:
          SIRIX_SMOKE_DISK_FLOOR_KIB: '10485760'
        shell: bash
        run: |
          for constructor in PSMS PSMW; do
            SIRIX_SMOKE_OMIT_CONSTRUCTOR="$constructor" \
              tests/native/run-smoke.sh core "$RUNNER_TEMP/native-library/mutation-$constructor" 2>&1 \
              | tee "$RUNNER_TEMP/native-library/mutation-$constructor.log"
          done
      - name: Preserve build, loader, teardown and omission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-library-smoke-linux-x64
          path: |
            ${{ runner.temp }}/native-library/**/*.log
            ${{ runner.temp }}/native-library/**/*.trace
            ${{ runner.temp }}/native-library/**/elf.txt
            ${{ runner.temp }}/native-library/**/*.classpath
          if-no-files-found: warn

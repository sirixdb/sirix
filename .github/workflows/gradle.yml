# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  schedule:
    - cron: '0 4 * * *'
jobs:
  Build:
    name: Compile and package
    outputs:
      sonar-enabled: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && github.base_ref == 'main' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             github.actor != 'dependabot[bot]') }}
    # Run the deterministic static-analysis gate once; downstream jobs reuse build output.
    env:
      ORG_GRADLE_PROJECT_errorProne: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and package
        run: ./gradlew classes testClasses :sirix-benchmarks:jmhClasses :sirix-rest-api:shadowJar spotlessCheck --parallel --refresh-dependencies
      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}

  TestCore:
    name: Test sirix-core (${{ matrix.lane }})
    needs: Build
    runs-on: ubuntu-latest
    # Complementary class filters retain the full suite in concurrent jobs; baseline timings
    # and coverage verification are documented in docs/CI_CORE_HEADROOM.md.
    # Keep both gating even when one fails; Deploy's TestCore dependency requires both.
    strategy:
      fail-fast: false
      matrix:
        lane: [hot-property, remaining]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore build output
        uses: actions/cache/restore@v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}
      - name: Test sirix-core
        run: >-
          ./gradlew :sirix-core:test -PcoreTestLane=${{ matrix.lane }}
          ${{ needs.Build.outputs.sonar-enabled == 'true' && '-Pcoverage' || '' }} --info --stacktrace
      - name: Upload core coverage
        if: needs.Build.outputs.sonar-enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-${{ matrix.lane }}
          overwrite: true
          path: |
            bundles/sirix-core/build/jacoco/*.exec
            bundles/sirix-core/build/test-results/**/*.xml
          if-no-files-found: error
          retention-days: 3

  TestQuery:
    name: Test sirix-query, sirix-kotlin-api, sirix-kotlin-cli
    needs: Build
    runs-on: ubuntu-latest
    # Instrumented tests exceeded 20 minutes before MCP/offline REST reporting could start.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore build output
        uses: actions/cache/restore@v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}
      - name: Test sirix-query, sirix-kotlin-api, and sirix-kotlin-cli
        run: >-
          ./gradlew :sirix-query:test :sirix-kotlin-api:test :sirix-kotlin-cli:test
          ${{ needs.Build.outputs.sonar-enabled == 'true' && '-Pcoverage' || '' }} --parallel --info --stacktrace
      # These also ran in the old Sonar build. Keep their probes, including offline REST's
      # contribution to the query report, without starting the Docker-backed REST suite.
      - name: Test MCP and report offline REST coverage
        if: needs.Build.outputs.sonar-enabled == 'true'
        run: >-
          ./gradlew :sirix-query:jacocoTestReport :sirix-kotlin-api:jacocoTestReport
          :sirix-kotlin-cli:jacocoTestReport :sirix-mcp:jacocoTestReport :sirix-rest-api:jacocoTestReport
          -x :sirix-rest-api:test --info --stacktrace
      - name: Upload query, Kotlin, MCP, and offline REST coverage
        if: needs.Build.outputs.sonar-enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-query
          overwrite: true
          path: |
            bundles/sirix-query/build/reports/jacoco/test/jacocoTestReport.xml
            bundles/sirix-kotlin-api/build/reports/jacoco/test/jacocoTestReport.xml
            bundles/sirix-kotlin-cli/build/reports/jacoco/test/jacocoTestReport.xml
            bundles/sirix-mcp/build/reports/jacoco/test/jacocoTestReport.xml
            bundles/sirix-rest-api/build/reports/jacoco/test/jacocoTestReport.xml
            bundles/sirix-query/build/test-results/**/*.xml
            bundles/sirix-kotlin-api/build/test-results/**/*.xml
            bundles/sirix-kotlin-cli/build/test-results/**/*.xml
            bundles/sirix-mcp/build/test-results/**/*.xml
            bundles/sirix-rest-api/build/test-results/offlineTest/*.xml
          if-no-files-found: error
          retention-days: 3

  PythonTooling:
    name: Python mutation tooling
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test mutation tooling with branch coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/python.coverage
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary :all: coverage==7.17.3
          python3 -B -m coverage run --branch --source=.github/scripts --omit='*/tests/*' \
            -m unittest discover -s .github/scripts/tests -p 'test_pr_mutation.py'
          python3 -m coverage xml -o "$RUNNER_TEMP/python-coverage.xml"
          python3 -m coverage report --fail-under=85
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python
          path: ${{ runner.temp }}/python-coverage.xml
          if-no-files-found: error
          retention-days: 3

  MutationTesting:
    name: PIT changed-source mutation testing
    needs: [Build, PythonTooling]
    if: github.event_name == 'pull_request'
    # Informational rollout. Enable only after survivor/incomplete baselines are resolved.
    continue-on-error: ${{ vars.MUTATION_BLOCKING != 'true' }}
    permissions:
      contents: read
    concurrency:
      group: mutation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR merge revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed main sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/scripts/pr_mutation.py select
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/pr-mutation"
      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - name: Restore build output
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Run bounded PIT analysis
        # Always enforce internally so incomplete runs remain visible as a failed informational
        # job. The job-level rollout switch determines whether this fails the PR.
        run: >-
          python3 .github/scripts/pr_mutation.py run --seconds 1320 --blocking
          --output "$RUNNER_TEMP/pr-mutation"
      - name: Publish mutation summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pr-mutation/summary.md" ]]; then
            cat "$RUNNER_TEMP/pr-mutation/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mutation analysis incomplete: setup/selection failed; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-mutation
          path: ${{ runner.temp }}/pr-mutation
          if-no-files-found: warn
          retention-days: 14

  Sonar:
    name: Run Sonarqube
    needs: [Build, TestCore, TestQuery, PythonTooling]
    # Secret boundary: docs/VERIFICATION.md#sonarcloud-analysis.
    # Release-branch and scheduled CI keep their existing behavior (no Sonar analysis).
    if: needs.Build.outputs.sonar-enabled == 'true'
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: sonar-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Restore build output
        uses: actions/cache/restore@v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Download core coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-core-*
          path: build/sonar-coverage
      - name: Download query, Kotlin, MCP, and offline REST coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-query
          path: bundles
      - name: Download Python tooling coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-python
          path: build/reports/python
      - name: Merge core coverage and verify reports
        run: |
          test -s build/reports/python/python-coverage.xml
          for lane in hot-property remaining; do
            cp -a "build/sonar-coverage/coverage-core-$lane/test-results" bundles/sirix-core/build/
          done
          ./gradlew :sirix-core:jacocoMergedReport --info --stacktrace --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'
          for module in sirix-core sirix-query sirix-kotlin-api sirix-kotlin-cli sirix-mcp sirix-rest-api; do
            test -s "bundles/$module/build/reports/jacoco/test/jacocoTestReport.xml"
          done
      - name: Analyze and check quality gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Use the same checkout as the producing lanes so bytecode and probes match exactly.
        # GitHub Actions supplies the PR parameters for decoration automatically.
        run: >-
          ./gradlew sonar --info --stacktrace --max-workers=2
          -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g'

  TestPlatforms:
    name: Cross-platform tests (${{ matrix.os }} / ${{ matrix.lane.name }})
    needs: Build
    runs-on: ${{ matrix.os }}
    # GATING lanes since two consecutive fully-green matrices on main (runs 29148084844 and
    # 29148832520, 2026-07-11) — the earlier flakiness was pre-existing engine races, fixed in
    # #1101/#1103/#1104/#1105. These runs back the README's macOS/Windows claims. The REST API
    # module is excluded (needs Docker/Keycloak, unavailable on these runners), as are
    # native-image builds. If a lane turns flaky again, diagnose the race — don't quietly
    # restore continue-on-error.
    #
    # Split by module group: run as one job the Windows lane took 29 min (run 30146942073) with
    # sirix-core and sirix-query serialized behind each other, making it the critical path of the
    # whole workflow. The two groups are the natural cut — they were the two ~equal halves of that
    # 29 min — and they now run concurrently instead.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        lane:
          - name: core
            tasks: ':sirix-core:test'
          - name: query
            tasks: ':sirix-query:test :sirix-kotlin-api:test :sirix-kotlin-cli:test'
        # Heap budgets differ per runner: macOS arm64 has 7 GB total, windows-latest 16 GB.
        include:
          - os: macos-latest
            daemonHeap: 3g
            testHeap: 3g
          - os: windows-latest
            daemonHeap: 4g
            testHeap: 6g
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx${{ matrix.daemonHeap }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      # Defender's real-time scanner sits in front of every one of the many small files a Gradle
      # build and a storage engine's tests write. Excluding the work volume and the JVM processes
      # is the single cheapest Windows win available. Best-effort: never fail the lane over it.
      - name: Exclude the build from Defender (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # The work root (D:\a) holds both the checkout and the Gradle user home the
          # setup-gradle action provisions next to it, so exclude the whole thing.
          $workRoot = Split-Path -Parent (Split-Path -Parent $env:GITHUB_WORKSPACE)
          foreach ($path in @($workRoot, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE)) {
            if ($path) { Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue }
          }
          foreach ($proc in @('java.exe', 'javac.exe')) {
            Add-MpPreference -ExclusionProcess $proc -ErrorAction SilentlyContinue
          }
      # The tests write their databases under java.io.tmpdir, which on Windows defaults to
      # C:\Users\...\AppData\Local\Temp — the network-backed OS disk, not the local SSD the
      # workspace lives on. build.gradle honours TMPDIR, so point it at the fast volume.
      - name: Route test scratch files onto the workspace volume (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sirix-tests'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "TMPDIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # No build-output cache restore: the Linux-compiled outputs' cache paths are not portable,
      # and a cold compile also exercises the toolchain on the target OS. --build-cache is a
      # different thing and is safe here — it reuses this platform's own task outputs across runs.
      # -PexcludeHeavyTests skips @Tag("heavy") soak-style suites (20+ min per test on these
      # 3-core runners — the round-2 macOS lane spent its whole hour inside two of them).
      # Full heavy coverage stays on the Linux jobs above.
      # -PtestHeap*: the default 5 GB initial fork heap does not fit a 7 GB macOS runner next to
      # the daemon. Sizing it to the runner keeps the machine out of swap.
      # --continue: without it a sirix-query failure aborts the invocation and the kotlin modules
      # never run on that platform — which is how the sirix-query XMark CRLF failure stayed
      # invisible for five rounds. One module's failure must not mask another's result.
      - name: Test ${{ matrix.lane.name }} modules
        run: ./gradlew ${{ matrix.lane.tasks }} -PexcludeHeavyTests=true -PtestHeapMin=512m -PtestHeapMax=${{ matrix.testHeap }} --continue --build-cache --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.lane.name }}
          path: '**/build/reports/tests/test'
          retention-days: 14

  TestRestApi:
    name: Test sirix-rest-api + Python client
    needs: Build
    runs-on: ubuntu-latest
    # 30 rather than 20 minutes: this job now also runs the module's own JVM test suite, which
    # brings up its Keycloak container before the Python client brings up its own.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore build output
        uses: actions/cache/restore@v4
        with:
          path: |
            **/build
          key: build-${{ github.run_id }}
      # The JVM suite must tear down its Compose project before the Python client starts the root
      # project: both publish Keycloak on host port 8080 and must not overlap.
      - name: Test sirix-rest-api (Keycloak via Docker Compose)
        run: ./gradlew :sirix-rest-api:test --info --stacktrace
      - name: Upload REST API test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-sirix-rest-api
          path: 'bundles/sirix-rest-api/build/reports/tests'
          retention-days: 14
      - name: Checkout Python client
        uses: actions/checkout@v4
        with:
          repository: sirixdb/sirix-python-client
          path: ./sirix-python-client
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
      - name: Install Python client dependencies and run tests
        run: |
          docker compose up -d keycloak
          python -m pip install --upgrade pip
          pip install -r sirix-python-client/requirements-all.txt
          sleep 40
          java -Xms1g -Xmx4g --enable-preview --enable-native-access=ALL-UNNAMED --add-modules=jdk.incubator.vector --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED -jar ./bundles/sirix-rest-api/build/libs/sirix-rest-api-*-fat.jar -conf ./bundles/sirix-rest-api/src/main/resources/sirix-conf.json &
          echo "Waiting for REST API on port 9443..."
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://localhost:9443/ 2>/dev/null; then
              echo "REST API is up after ${i}s"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "REST API failed to start within 120s"
              exit 1
            fi
            sleep 1
          done
          python -m pytest sirix-python-client -v

  NativeImageTest:
    name: Native Image (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [sirix-query, sirix-kotlin-cli, sirix-rest-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: JVM smoke test
        run: ./gradlew :${{ matrix.module }}:nativeImageSmokeTest --info
      - name: Stop Gradle daemon (free memory for native compilation)
        run: ./gradlew --stop
      - name: Native image smoke test
        run: ./gradlew :${{ matrix.module }}:nativeSmokeTest --no-daemon --info

  Deploy:
    name: Deploy to OSSRH and Docker Hub
    if: ${{ github.repository_owner == 'sirixdb' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    needs: [TestCore, TestQuery, TestRestApi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_USERNAME_TOKEN }}
      SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_PASSWORD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Spotless can resolve the origin/main ratchet ref.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle deploy
        run: ./gradlew travisReleaseSnapshot --info
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Hub deploy
        run: bash docker_push.sh

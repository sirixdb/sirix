import java.io.File
import java.lang.ProcessHandle
import java.nio.file.Files
import java.nio.file.StandardCopyOption

final File receipt = new File(System.getProperty('sirix.prMutationDaemonPidFile'))
final File pending = new File(receipt.path + '.tmp')
pending.text = ProcessHandle.current().pid().toString()
Files.move(pending.toPath(), receipt.toPath(), StandardCopyOption.ATOMIC_MOVE,
        StandardCopyOption.REPLACE_EXISTING)

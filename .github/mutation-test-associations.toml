# Existing behaviour tests the PR mutation lane must run for a changed class (CONV-204), when
# their names do not match the class. Nothing more: no patterns, no reasons, no other settings.
# `class` is the top-level binary name of a main class; `tests` are top-level test classes
# declared in the same module. Associations share the lane's per-module test cap.
# See docs/VERIFICATION.md#pr-mutation-testing and spec/CONV-conventions.md.

[[association]]
class = "io.sirix.io.ram.RAMStorage"
tests = ["io.sirix.io.ram.RAMStorageTruncateToTest"]

# TXN-310/311 span writer construction, commit attempts, persisted history and reopen.
[[association]]
class = "io.sirix.access.trx.page.StorageEngineWriterFactory"
tests = ["io.sirix.io.CommitTimestampPrecisionConformanceTest", "io.sirix.io.CommitTimestampLateFailureTest"]

[[association]]
class = "io.sirix.access.trx.page.NodeStorageEngineWriter"
tests = ["io.sirix.io.CommitTimestampPrecisionConformanceTest", "io.sirix.io.CommitTimestampLateFailureTest"]

# The release contract exercises refused and admitted grouping through every public compiler
# factory, including cold reopen; its name spans these entry points.
[[association]]
class = "io.sirix.query.SirixCompileChain"
tests = ["io.sirix.query.scan.VectorizedReleaseCorrectnessTest"]

[[association]]
class = "io.sirix.query.compiler.translator.SirixBlockPipelineStrategy"
tests = ["io.sirix.query.scan.VectorizedReleaseCorrectnessTest"]

[[association]]
class = "io.sirix.query.compiler.translator.SirixPipelineStrategy"
tests = ["io.sirix.query.scan.VectorizedReleaseCorrectnessTest"]

[[association]]
class = "io.sirix.query.scan.VectorizedRouteRefusedException"
tests = ["io.sirix.query.scan.VectorizedReleaseCorrectnessTest"]

# TXN-615 lifetime, storage ownership and backup contracts cross these entry points.
[[association]]
class = "io.sirix.access.DatabaseHandle"
tests = ["io.sirix.access.DatabasesInMemoryLifetimeTest"]

[[association]]
class = "io.sirix.access.LocalDatabase"
tests = ["io.sirix.access.DatabasesInMemoryLifetimeTest", "io.sirix.access.LocalDatabaseInMemoryLifetimeTest", "io.sirix.index.aggregate.DeclaredTemporalAggregateFailureTest", "io.sirix.index.aggregate.DerivedIndexMaintainerHistoryTest"]

[[association]]
class = "io.sirix.access.InMemoryResources"
tests = ["io.sirix.backup.BackupManagerInMemoryResourcesTest"]

[[association]]
class = "io.sirix.io.Reader"
tests = ["io.sirix.io.ram.RAMStorageContractTest"]

# VER-201 ISO timestamp precision is asserted through the public output boundaries.
[[association]]
class = "io.sirix.service.json.serialize.JsonSerializer"
tests = ["io.sirix.io.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.service.json.serialize.JsonLimitedSerializer"
tests = ["io.sirix.io.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.service.json.serialize.JsonRecordSerializer"
tests = ["io.sirix.io.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.service.xml.serialize.XmlSerializer"
tests = ["io.sirix.io.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.query.function.sdb.trx.GetRevisionTimestamp"
tests = ["io.sirix.query.function.sdb.trx.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.mcp.ToolHandlers"
tests = ["io.sirix.mcp.CommitTimestampOutputTest"]

[[association]]
class = "io.sirix.rest.crud.HistoryHandler"
tests = ["io.sirix.rest.CommitTimestampOutputTest"]

# CONV-301: distinguish document ownership work from XML name-dictionary initialization.
[[association]]
class = "io.sirix.utils.ReplayWorkDiagnostics"
tests = ["io.sirix.budget.LifecycleWorkBudgetTest"]
